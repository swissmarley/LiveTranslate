<!doctype html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box;margin:0}
html,body{width:1024px;height:500px;overflow:hidden;background:#0A0C10;font-family:'Inter',sans-serif;color:#F2F4F8}
.bg{position:absolute;inset:0;background:
  radial-gradient(520px 380px at 12% 108%, rgba(47,107,255,.30), transparent 70%),
  radial-gradient(520px 380px at 92% -8%, rgba(234,90,34,.30), transparent 70%),
  linear-gradient(180deg,#141922,#0A0C10)}
.left{position:absolute;left:68px;top:0;height:500px;width:520px;display:flex;flex-direction:column;justify-content:center}
.brand{display:flex;align-items:center;gap:18px;margin-bottom:26px}
.brand img{height:74px}
.brand span{font-size:30px;font-weight:700;letter-spacing:-.3px;color:#F2F4F8}
h1{font-size:58px;line-height:1.04;font-weight:800;letter-spacing:-1.6px}
h1 em{font-style:normal;background:linear-gradient(90deg,#6C9CFF,#FF8A55);-webkit-background-clip:text;color:transparent}
p{margin-top:20px;font-size:23px;line-height:1.35;color:#A2ABBA;font-weight:500}
.chips{display:flex;gap:10px;margin-top:26px}
.chip{padding:8px 15px;border-radius:999px;font-size:17px;font-weight:600;background:#1D222B;border:1px solid #2C3340;color:#D7DCE6}
.phone{position:absolute;left:672px;top:38px;width:284px;height:568px;border-radius:38px;padding:9px;background:#272D37;
  box-shadow:0 0 0 2px #394152,0 30px 60px rgba(0,0,0,.6)}
.phone .scr{width:100%;height:100%;border-radius:30px;overflow:hidden;background:#0A0C10}
.phone img{width:100%;display:block}
.b{position:absolute;padding:13px 20px;border-radius:22px;font-size:20px;font-weight:600;box-shadow:0 12px 30px rgba(0,0,0,.45)}
.b1{left:600px;top:96px;background:#EA5A22;color:#fff;border-bottom-right-radius:6px;transform:rotate(180deg)}
.b2{left:884px;top:300px;background:#2F6BFF;color:#fff;border-bottom-left-radius:6px}
</style></head><body><div class="bg"></div>
<div class="left">
  <div class="brand"><img src="logo-mark.png"><span>LiveTranslate</span></div>
  <h1>Talk face to face.<br><em>In any language.</em></h1>
  <p>Speak, and they hear it in their own language.</p>
  <div class="chips"><div class="chip">34 languages</div><div class="chip">Live speech</div><div class="chip">Spoken aloud</div></div>
</div>
<div class="phone"><div class="scr"><img src="../android/phone-screenshots/01-face-to-face.png"></div></div>
</body></html>
